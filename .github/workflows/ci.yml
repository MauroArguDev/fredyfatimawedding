name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint suppression budget
        run: npm run lint:disables

      - name: Typecheck
        run: npm run typecheck

      - name: Tests and coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build
