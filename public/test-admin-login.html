<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Admin login smoke test</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 360px; margin: 60px auto; }
      input { display: block; width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
      button { padding: 8px 16px; cursor: pointer; }
      #result { margin-top: 16px; padding: 10px; border-radius: 4px; white-space: pre-wrap; }
      .ok { background: #d4edda; color: #155724; }
      .err { background: #f8d7da; color: #721c24; }
    </style>
  </head>
  <body>
    <h3>Admin login smoke test — fredyfatimawedding</h3>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required />
      <input id="password" type="password" placeholder="Password" required />
      <button type="submit">Sign in</button>
    </form>
    <div id="result"></div>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js';
      import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js';

      const app = initializeApp({
        apiKey: 'AIzaSyDJdqyfT6AUOer0ggFnGpIbWqiFzBBFgqU',
        authDomain: 'fredyfatimawedding.firebaseapp.com',
      });
      const auth = getAuth(app);

      const form = document.getElementById('loginForm');
      const result = document.getElementById('result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        result.className = '';
        result.textContent = 'Checking...';
        try {
          const credential = await signInWithEmailAndPassword(auth, email, password);
          result.className = 'ok';
          result.textContent = `Login succeeded.\nUID: ${credential.user.uid}\nEmail: ${credential.user.email}`;
        } catch (error) {
          result.className = 'err';
          result.textContent = `Error: ${error.code}\n${error.message}`;
        }
      });
    </script>
  </body>
</html>
